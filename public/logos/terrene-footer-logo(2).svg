<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="100%">
  <defs>
    <!-- The gradient from your previous SVG -->
    <linearGradient id="paint0_linear_2004_2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop stop-color="#F2EDE6"/>
      <stop offset="1" stop-color="#1F1D1D"/>
    </linearGradient>

    <style>
      .brand-main { fill: url(#paint0_linear_2004_2); }
      .brand-green { fill: #02b921; }
